trigger:
  branches:
    include:
      - dev

pr:
  branches:
    include:
      - dev

pool:
  vmImage: ubuntu-latest

variables:
  CI: 'true'

steps:
- task: UseNode@1
  displayName: 'Use Node.js 22'
  inputs:
    version: '22.x'

- script: npm ci --no-audit --no-fund
  displayName: 'Install dependencies'

- script: npm run typecheck
  displayName: 'TypeScript check'

- script: npm run lint
  displayName: 'Lint'

- script: npm test
  displayName: 'Run tests'