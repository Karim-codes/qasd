trigger: none

pr:
  branches:
    include:
      - main

pool:
  vmImage: macOS-15

steps:
- task: UseNode@1
  displayName: 'Use Node.js 22'
  inputs:
    version: '22.x'
    checkLatest: false

- bash: |
    set -euo pipefail
    npm ci --no-audit --no-fund
  displayName: 'Install JavaScript dependencies'

- bash: |
    set -euo pipefail
    npx --no-install expo prebuild --platform ios --clean --no-install
  displayName: 'Generate iOS project with Expo'

- bash: |
    set -euo pipefail
    cd ios
    pod install
  displayName: 'Install iOS dependencies with CocoaPods'

- bash: |
    set -euo pipefail

    echo "Generated iOS files:"
    find ios -maxdepth 1 -type d -print

    echo "Xcode workspaces:"
    find ios -maxdepth 1 -name "*.xcworkspace" -print

    echo "Xcode projects:"
    find ios -maxdepth 1 -name "*.xcodeproj" -print

        echo "Xcode workspace details:"
    xcodebuild \
      -workspace ios/Qasd.xcworkspace \
      -list
  displayName: 'Discover generated Xcode project'

- bash: |
    set -euo pipefail

    sudo xcode-select \
      --switch /Applications/Xcode_16.4.app/Contents/Developer

    echo "Node:"
    node --version

    echo "npm:"
    npm --version

    echo "Xcode:"
    xcodebuild -version

    echo "CocoaPods:"
    pod --version
  displayName: 'Verify macOS build toolchain'