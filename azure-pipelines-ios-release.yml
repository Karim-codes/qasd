trigger: none

pr:
  branches:
    include:
      - main

pool:
  name: Qasd-Mac

steps:
- task: UseNode@1
  displayName: 'Use Node.js 22'
  inputs:
    version: '22.x'
    checkLatest: false

- bash: |
    set -euo pipefail

    echo "Node:"
    node --version

    echo "npm:"
    npm --version

    echo "Architecture:"
    uname -m

    echo "Xcode:"
    xcodebuild -version

    echo "Xcode developer directory:"
    xcode-select -p

    echo "CocoaPods:"
    pod --version

  displayName: 'Verify self-hosted Mac build toolchain'

- bash: |
    set -euo pipefail
    npm ci --no-audit --no-fund

  displayName: 'Install JavaScript dependencies'

- bash: |
    set -euo pipefail
    npx --no-install expo prebuild --platform ios --clean --no-install

  displayName: 'Generate iOS project with Expo'

- bash: |
    set -euo pipefail
    cd ios
    pod install

  displayName: 'Install iOS dependencies with CocoaPods'

- bash: |
    set -euo pipefail

    echo "Generated iOS files:"
    find ios -maxdepth 1 -type d -print

    echo "Xcode workspaces:"
    find ios -maxdepth 1 -name "*.xcworkspace" -print

    echo "Xcode projects:"
    find ios -maxdepth 1 -name "*.xcodeproj" -print

    echo "Xcode workspace details:"
    xcodebuild \
      -workspace ios/Qasd.xcworkspace \
      -list

  displayName: 'Discover generated Xcode project'

- bash: |
    set -euo pipefail

    echo "Building Qasd for iOS Simulator..."

    xcodebuild \
      -workspace ios/Qasd.xcworkspace \
      -scheme Qasd \
      -configuration Release \
      -sdk iphonesimulator \
      CODE_SIGNING_ALLOWED=NO \
      build

  displayName: 'Build Qasd for iOS Simulator'