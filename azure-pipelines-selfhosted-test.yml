trigger: none

pool:
  name: Qasd-Mac

steps:
- bash: |
    set -euo pipefail

    echo "======================================"
    echo " QASD SELF-HOSTED MAC ENVIRONMENT"
    echo "======================================"

    echo ""
    echo "=== MACHINE ==="
    echo "Hostname:"
    hostname

    echo "Architecture:"
    uname -m

    echo "macOS:"
    sw_vers

    echo "User:"
    whoami

    echo "Working directory:"
    pwd

    echo ""
    echo "=== PATH ==="
    echo "$PATH"

    echo ""
    echo "=== NODE ==="
    which node || true
    node --version || true

    echo ""
    echo "=== NPM ==="
    which npm || true
    npm --version || true

    echo ""
    echo "=== XCODE ==="
    xcode-select -p || true
    xcodebuild -version || true

    echo ""
    echo "=== COCOAPODS ==="
    which pod || true
    pod --version || true

    echo ""
    echo "=== RUBY ==="
    which ruby || true
    ruby --version || true

    echo ""
    echo "=== NPX ==="
    which npx || true
    npx --version || true

    echo ""
    echo "=== DISK SPACE ==="
    df -h /

    echo ""
    echo "======================================"
    echo " ENVIRONMENT CHECK COMPLETE"
    echo "======================================"

  displayName: 'Inspect Qasd self-hosted build environment'